   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="358.74" y="96.155246" transform="rotate(-0 358.74 96.155246)">6. TREATMENT FILTER</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(358.74 117.545397)">Meaningful changes;</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(358.74 127.867749)">ontology removes</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(358.74 138.1901)">unsafe drugs</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="509.4" y="96.155246" transform="rotate(-0 509.4 96.155246)">7. RECOMMENDATION CARD</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 117.545397)">Plan in steps:</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 127.867749)">lifestyle, then 1 drug,</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 138.1901)">then 2. Expected change</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 148.512452)">per step from published</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 158.834804)">effect sizes; review</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 169.157155)">rule per step.</text>
   </g>
   <g id="text_17">
