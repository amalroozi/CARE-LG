   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="18.36" y="39.131246" transform="rotate(-0 18.36 39.131246)">1. KNOWLEDGE LAYER</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 60.521397)">ICD-10-CM ontology: a</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 70.843749)">rule on a code passes</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 81.1661)">down to its sub-codes.</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 91.488452)">Hard, soft and filter</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 101.810804)">rules.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="18.36" y="141.774446" transform="rotate(-0 18.36 141.774446)">2. MODEL + LATENT GRAPH</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 163.163925)">MLP or XGBoost; VAE;</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 173.486277)">k-NN graph</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="182.97" y="39.131246" transform="rotate(-0 182.97 39.131246)">3. TIER 1: CERTIFIED REAL</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 60.521397)">Dijkstra on the rule-</text>
