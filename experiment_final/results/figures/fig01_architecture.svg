   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="18.36" y="63.676921" transform="rotate(-0 18.36 63.676921)">1. KNOWLEDGE LAYER</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 85.067072)">ICD-10-CM ontology: a</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 95.389424)">rule on a code passes</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 105.711775)">down to its sub-codes.</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 116.034127)">Hard, soft and filter</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 126.356479)">rules.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="18.36" y="166.320121" transform="rotate(-0 18.36 166.320121)">2. MODEL + LATENT GRAPH</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 187.7096)">MLP or XGBoost; VAE;</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.36 198.031952)">k-NN graph</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="182.97" y="63.676921" transform="rotate(-0 182.97 63.676921)">3. TIER 1: CERTIFIED REAL</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 85.067072)">Dijkstra on the rule-</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 95.389424)">pruned graph; clingo</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 105.711775)">certificate</text>
   </g>
