   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="182.97" y="166.320121" transform="rotate(-0 182.97 166.320121)">4. TIER 2: GUIDED SYNTHETIC</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 187.710272)">Genetic search for a new,</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 198.032624)">valid, plausible profile.</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 208.354975)">Ontology guides the</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 218.677327)">start; hard rules always</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 228.999679)">hold.</text>
   </g>
