   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 324.567872)">Exhaustive proof; reports</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(182.97 334.890224)">the closest miss</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="358.74" y="120.700921" transform="rotate(-0 358.74 120.700921)">6. TREATMENT FILTER</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(358.74 142.091072)">Meaningful changes;</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(358.74 152.413424)">ontology removes</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(358.74 162.735775)">unsafe drugs</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="509.4" y="120.700921" transform="rotate(-0 509.4 120.700921)">7. RECOMMENDATION CARD</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 142.091072)">Plan in steps:</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 152.413424)">lifestyle, then 1 drug,</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 162.735775)">then 2. Expected change</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 173.058127)">per step from published</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 183.380479)">effect sizes; review</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(509.4 193.70283)">rule per step.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="671.22" y="120.700921" transform="rotate(-0 671.22 120.700921)">8. EXPLANATION</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 142.091072)">Template text, no</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 152.413424)">LLM. Every rule,</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 162.735775)">ICD-10-CM code,</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 173.058127)">number and</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 183.380479)">citation is a tag</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 193.70283)">checked by</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(671.22 204.02451)">trace().</text>
   </g>
