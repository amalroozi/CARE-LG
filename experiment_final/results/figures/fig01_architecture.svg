   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.2" y="39.344112" transform="rotate(-0 7.2 39.344112)">A learned risk model and graph, constrained by medical rules, find the safest path to lower risk and turn it into a checked treatment plan.</text>
